[project]
name = "agent-router"
version = "0.1.2"
description = "Install and remove agent skills and hooks through native agent surfaces"
readme = "README.md"
authors = [
    { name = "ZackaryW", email = "gitzackw@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "tomlkit>=0.15.0",
]

[project.urls]
Repository = "https://github.com/ZackaryW/agent-router"

[project.optional-dependencies]
cli = ["typer>=0.27.0"]

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "pytest>=9.0.0",
]

[project.scripts]
agent-router = "agent_router.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
